services:
  - type: web
    name: prepsense-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/main.py"
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
